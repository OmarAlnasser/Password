name: Build & test

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags finding

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Hisn-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Hisn-windows
          path: build/windows/x64/runner/Release/

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Show Xcode / CocoaPods versions
        run: |
          xcodebuild -version
          pod --version
      - run: flutter pub get
      # Unsigned compile check only: the .app cannot be installed without re-signing.
      - name: Build iOS app (unsigned compile check)
        run: flutter build ios --release --no-codesign
      - name: Zip Runner.app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app Hisn-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hisn-ios-unsigned
          path: Hisn-ios-unsigned.zip
          if-no-files-found: error
