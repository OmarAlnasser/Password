name: vaultsnap
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  sodium: ^4.1.1+2
  crypto: ^3.0.7
  unorm_dart: ^0.3.3
  drift: ^2.35.1
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1
  zxcvbn: ^1.0.0
  local_auth: ^3.0.2
  biometric_storage: ^5.0.1
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.3
  receive_sharing_intent: ^1.9.0
  supabase_flutter: ^2.18.0
  hotkey_manager: ^0.2.3
  window_manager: ^0.5.2
  csv: ^8.0.0
  http: ^1.6.0
  file_picker: ^11.0.3
  uuid: ^4.6.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  test: ^1.31.1
  drift_dev: ^2.35.1
  build_runner: ^2.16.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/eff_large_wordlist.txt
    # SIL OFL 1.1 texts for the bundled fonts. They ship inside the app because
    # the licence requires it, and so an "open-source licences" screen can
    # register them with LicenseRegistry. See docs/DESIGN.md (Fonts).
    - assets/fonts/outfit/OFL.txt
    - assets/fonts/ibm-plex-sans-arabic/OFL.txt
    - assets/fonts/jetbrains-mono/OFL.txt

  # Fonts are bundled so the app never contacts a font CDN (a password manager
  # must not tell a third party which fonts, and therefore which app, it uses).
  # Static instances only: they render identically on Android, iOS and Windows.
  # The weight: values mirror each file's own OS/2 weight class (Flutter's
  # FontLoader reads the weight from the font file), so keep the two in sync.
  fonts:
    # English / Latin UI text (the portfolio's --font-en).
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/outfit/Outfit-Bold.ttf
          weight: 700
    # Arabic UI text (the portfolio's --font-ar). It also contains a Latin
    # alphabet, so it is the fallback for Outfit.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Passwords, emails, URLs, codes. Coding ligatures are removed from these
    # files on purpose (see assets/fonts/README.md).
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Medium.ttf
          weight: 500

hooks:
  user_defines:
    sqlite3:
      # SQLCipher build of SQLite (downloaded by package:sqlite3's build hook,
      # verified against sha256 hashes pinned in the package).
      source: sqlcipher
